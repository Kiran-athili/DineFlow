<div class="auth-page">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email to receive a reset token.</p>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="forgotPassword()">
      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Enter your registered email"
        />

        <small *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
          Valid email is required
        </small>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Sending...' : 'Send Reset Token' }}
      </button>
    </form>

    <div *ngIf="successMessage" class="token-info">
      <p>
        Please check your email and copy the reset token.
      </p>

      <a routerLink="/reset-password" class="reset-link">
        Go to Reset Password
      </a>
    </div>

    <div class="links">
      Remember password?
      <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
