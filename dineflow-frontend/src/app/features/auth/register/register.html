<div class="auth-page">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Register as a customer</p>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="register()">

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="fullName"
          placeholder="Enter full name"
        />

        <small *ngIf="registerForm.get('fullName')?.touched && registerForm.get('fullName')?.invalid">
          Full name is required
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Enter email"
        />

        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Valid email is required
        </small>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          type="text"
          class="form-control"
          formControlName="phone"
          placeholder="Enter phone number"
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <div class="password-box">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
          />

          <button type="button" class="eye-btn" (click)="togglePassword()">
            <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>

        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          Password must be at least 6 characters
        </small>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <div class="links">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
