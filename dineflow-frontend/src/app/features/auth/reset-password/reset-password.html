<div class="auth-page">
  <div class="auth-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your reset token and new password.</p>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
      <div class="form-group">
        <label>Reset Token</label>

        <input
          class="form-control"
          formControlName="resetToken"
          placeholder="Paste reset token"
        />

        <small *ngIf="resetForm.get('resetToken')?.touched && resetForm.get('resetToken')?.invalid">
          Reset token is required
        </small>
      </div>

      <div class="form-group">
        <label>New Password</label>

        <div class="password-box">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="newPassword"
            placeholder="Enter new password"
          />

          <button type="button" class="eye-btn" (click)="togglePassword()">
            <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>

        <small *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid">
          Password must be at least 6 characters
        </small>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="links">
      <a routerLink="/forgot-password">Generate new token</a>
      <span> | </span>
      <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
